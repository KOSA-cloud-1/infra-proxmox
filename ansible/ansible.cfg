# =========================================================
# Ansible 기본 설정
# - 이 파일이 있는 디렉터리에서 ansible / ansible-playbook 실행 시 적용됨
# - 별도로 -i 옵션을 주지 않아도 inventory.ini를 기본 inventory로 사용
# =========================================================
[defaults]

# 기본 inventory 파일 지정
# 예: ansible-playbook playbook.yml 실행 시 자동으로 inventory.ini 사용
inventory           = inventory.ini

# SSH 최초 접속 시 host key 확인 비활성화
# 운영 환경에서는 보안상 true 권장
host_key_checking   = false

# playbook 실패 시 .retry 파일 생성 비활성화
# 불필요한 retry 파일이 프로젝트 디렉터리에 생기는 것을 방지
retry_files_enabled = false

# Ansible 실행 결과를 YAML 형식으로 출력
# 에러 메시지나 register 결과를 읽기 쉽게 보여줌
stdout_callback     = yaml

# 원격 호스트의 Python interpreter를 자동 탐색
# auto_silent는 자동 탐색 경고 메시지를 출력하지 않음
interpreter_python  = auto_silent

# 동시에 작업할 호스트 수
# 현재 값 10이면 최대 10개 노드에 병렬로 task 실행
forks               = 10

# SSH 연결 타임아웃
# 원격 호스트 접속이 30초 안에 되지 않으면 실패 처리
timeout             = 30

# fact 수집 방식
# smart는 fact cache가 있으면 재사용하고, 필요할 때만 다시 수집
gathering           = smart

# fact cache 저장 방식
# memory는 현재 ansible 실행 중에만 cache 유지
# playbook 실행이 끝나면 cache는 사라짐
fact_caching        = memory


# =========================================================
# SSH 연결 최적화 설정
# - Ansible은 기본적으로 SSH로 각 노드에 접속해 task를 실행
# - 아래 설정은 SSH 연결 재사용과 실행 속도 개선을 위한 설정
# =========================================================
[ssh_connection]

# SSH pipelining 활성화
# 원격 서버에 임시 파일을 복사하는 과정을 줄여 실행 속도 향상
# Ubuntu 환경에서는 보통 문제 없음
pipelining      = true

# SSH ControlMaster 사용
# 같은 호스트에 대해 SSH 연결을 새로 만들지 않고 기존 연결 재사용
control_master  = auto

# SSH ControlMaster 소켓 파일 경로
# %%h = 접속 호스트
# %%p = SSH 포트
# %%r = 원격 사용자
control_path    = /tmp/ansible-ssh-%%h-%%p-%%r

# SSH 연결 유지 시간
# task가 끝나도 60초 동안 연결을 유지해서 다음 task에서 재사용
control_persist = 60s
