- name: Install kube-vip manifest
  hosts: kube_vip
  become: true

  tasks:

    - name: Create manifests dir
      file:
        path: /etc/kubernetes/manifests
        state: directory
        mode: '0755'

    - name: Pull kube-vip image
      command: crictl pull ghcr.io/kube-vip/kube-vip:{{ kube_vip_version }}
      changed_when: false

    - name: Generate kube-vip manifest
      shell: |
        ctr -n k8s.io run --rm --net-host ghcr.io/kube-vip/kube-vip:{{ kube_vip_version }} vip /kube-vip manifest pod \
          --interface {{ vip_interface }} \
          --address {{ vip_address }} \
          --vipSubnet /{{ vip_cidr }} \
          --controlplane \
          --arp \
          --leaderElection \
          --leaseDuration 15 \
          --leaseRenewDuration 10 \
          --leaseRetry 2 \
        > /etc/kubernetes/manifests/kube-vip.yaml
      args:
        creates: /etc/kubernetes/manifests/kube-vip.yaml


- name: Initialize Kubernetes Cluster
  hosts: cp1
  become: true
  become_user: root

  tasks:

    # =====================================================
    # 1. Kubernetes 초기화
    # =====================================================
    - name: Add bootstrap VIP for kubeadm init
      shell: |
        ip addr show dev {{ vip_interface }} | grep -Fq "{{ vip_address }}/{{ vip_cidr }}" || \
          ip addr add {{ vip_address }}/{{ vip_cidr }} dev {{ vip_interface }}

    - name: Build API server certificate SANs
      set_fact:
        apiserver_cert_extra_sans: "{{ (apiserver_cert_extra_sans | default([vip_address])) + [hostvars[item].node_ip | default(hostvars[item].ansible_host)] }}"
      loop: "{{ groups['control_plane'] }}"

    - name: Initialize cluster
      shell: |
        kubeadm init \
          --control-plane-endpoint "{{ vip_address }}:6443" \
          --apiserver-advertise-address "{{ node_ip | default(ansible_host) }}" \
          --apiserver-cert-extra-sans "{{ apiserver_cert_extra_sans | unique | join(',') }}" \
          --upload-certs \
          --pod-network-cidr={{ pod_cidr }} \
      args:
        creates: /etc/kubernetes/admin.conf

    # =====================================================
    # 2. kubeconfig 설정
    # =====================================================
    - name: Setup kubeconfig directory
      file:
        path: /home/kosa/.kube
        state: directory
        owner: kosa
        group: kosa
        mode: '0700'

    - name: Copy admin.conf
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/kosa/.kube/config
        remote_src: yes
        owner: kosa
        group: kosa
        mode: '0600'

    # =====================================================
    # 3. API Server Ready 대기
    # =====================================================
    - name: Wait for Kubernetes API Server
      shell: kubectl --kubeconfig=/etc/kubernetes/super-admin.conf --server=https://{{ node_ip | default(ansible_host) }}:6443 --request-timeout=10s get --raw=/readyz
      register: k8s_ready
      retries: 30
      delay: 10
      until: k8s_ready.rc == 0
      changed_when: false

    # =====================================================
    # [수정] kubernetes-admin 에 cluster-admin 부여
    # 05_install_calico.yml 에 있던 task 를 여기로 이동
    # kube-vip RBAC 적용 전에 충분한 권한 확보가 필요하므로 먼저 처리
    # =====================================================
    - name: Grant cluster-admin to kubernetes-admin
      shell: |
        kubectl --kubeconfig=/etc/kubernetes/super-admin.conf \
          --server=https://{{ node_ip | default(ansible_host) }}:6443 \
          create clusterrolebinding kubernetes-admin-cluster-admin \
          --clusterrole=cluster-admin \
          --user=kubernetes-admin \
          --dry-run=client -o yaml | \
        kubectl --kubeconfig=/etc/kubernetes/super-admin.conf \
          --server=https://{{ node_ip | default(ansible_host) }}:6443 \
          apply -f -
      args:
        executable: /bin/bash

    # =====================================================
    # [수정] Role/RoleBinding → ClusterRole/ClusterRoleBinding 으로 변경
    # 기존: kube-system namespace 한정 Role 사용
    # 문제: kube-vip 가 leader election 시 leases 접근 권한 없음 → VIP 미할당
    # 해결: ClusterRole/ClusterRoleBinding 으로 클러스터 전체 범위 권한 부여
    # =====================================================
    - name: Grant kube-vip lease access
      shell: |
        kubectl --kubeconfig=/etc/kubernetes/super-admin.conf --server=https://{{ node_ip | default(ansible_host) }}:6443 --request-timeout=10s apply -f - <<'EOF'
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: kube-vip-lease-manager
        rules:
          - apiGroups: ["coordination.k8s.io"]
            resources: ["leases"]
            verbs: ["get", "list", "watch", "create", "update", "patch"]
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: kube-vip-lease-manager
        subjects:
          - kind: User
            name: kubernetes-admin
            apiGroup: rbac.authorization.k8s.io
        roleRef:
          kind: ClusterRole
          name: kube-vip-lease-manager
          apiGroup: rbac.authorization.k8s.io
        EOF

    # =====================================================
    # [수정] kube-vip 재시작 후 대기 시간 추가 (pause 20초)
    # 기존: 재시작 직후 바로 VIP 확인 → kubelet 이 새 컨테이너 띄우기 전에
    #       bootstrap VIP 제거 → kube-vip 가 VIP 획득 실패
    # =====================================================
    - name: Restart kube-vip after RBAC is ready
      shell: |
        crictl ps -a --name kube-vip -q | xargs -r crictl stop || true
        crictl ps -a --name kube-vip -q | xargs -r crictl rm || true

    - name: Wait for kube-vip to restart
      pause:
        seconds: 20

    - name: Remove bootstrap VIP after kube-vip takes over
      shell: |
        ip addr del {{ vip_address }}/{{ vip_cidr }} dev {{ vip_interface }} 2>/dev/null || true

    - name: Wait for Kubernetes API through VIP
      shell: kubectl --kubeconfig=/etc/kubernetes/super-admin.conf --server=https://{{ vip_address }}:6443 --request-timeout=10s get --raw=/readyz
      register: vip_ready
      retries: 30
      delay: 5
      until: vip_ready.rc == 0
      changed_when: false

    # =====================================================
    # 4. join command 생성 (Calico는 나중에 설치)
    # =====================================================
    - name: Get worker join command
      command: kubeadm token create --print-join-command
      register: worker_join
      no_log: true

    - name: Get certificate key
      command: kubeadm init phase upload-certs --upload-certs
      register: cert_key_raw
      no_log: true

    - name: Set join facts
      set_fact:
        worker_join_cmd: "{{ worker_join.stdout }}"
        cert_key: "{{ cert_key_raw.stdout_lines[-1] }}"
      no_log: true

    - name: Ensure local files directory exists
      file:
        path: "../files"
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false

    - name: Save worker join command to local file
      copy:
        dest: "../files/worker_join_cmd.txt"
        content: "{{ worker_join.stdout | trim }}\n"
        mode: '0600'
      delegate_to: localhost
      become: false
      no_log: true

    - name: Save certificate key to local file
      copy:
        dest: "../files/cert_key.txt"
        content: "{{ cert_key_raw.stdout_lines[-1] | trim }}\n"
        mode: '0600'
      delegate_to: localhost
      become: false
      no_log: true
