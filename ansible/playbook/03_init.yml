- name: Install kube-vip manifest
  hosts: kube_vip
  become: true

  tasks:

    - name: Create manifests dir
      file:
        path: /etc/kubernetes/manifests
        state: directory

    - name: Pull kube-vip image
      shell: |
        crictl pull ghcr.io/kube-vip/kube-vip:v0.8.0

    - name: Generate kube-vip manifest
      shell: |
        ctr -n k8s.io run --rm --net-host ghcr.io/kube-vip/kube-vip:v0.8.0 vip /kube-vip manifest pod \
          --interface {{ vip_interface }} \
          --address {{ vip_address }} \
          --vipSubnet {{ vip_cidr }} \
          --controlplane \
          --arp \
          --leaderElection \
        > /etc/kubernetes/manifests/kube-vip.yaml


- name: Initialize Kubernetes Cluster
  hosts: cp1
  become: true
  become_user: root

  tasks:

    # =====================================================
    # 1. Kubernetes 초기화
    # =====================================================
    - name: Add bootstrap VIP for kubeadm init
      shell: |
        ip addr show dev {{ vip_interface }} | grep -Fq "{{ vip_address }}/{{ vip_cidr }}" || \
          ip addr add {{ vip_address }}/{{ vip_cidr }} dev {{ vip_interface }}

    - name: Build API server certificate SANs
      set_fact:
        apiserver_cert_extra_sans: "{{ (apiserver_cert_extra_sans | default([vip_address])) + [hostvars[item].node_ip | default(hostvars[item].ansible_host)] }}"
      loop: "{{ groups['control_plane'] }}"

    - name: Initialize cluster
      shell: |
        kubeadm init \
          --control-plane-endpoint "{{ vip_address }}:6443" \
          --apiserver-advertise-address "{{ node_ip | default(ansible_host) }}" \
          --apiserver-cert-extra-sans "{{ apiserver_cert_extra_sans | unique | join(',') }}" \
          --upload-certs \
          --pod-network-cidr={{ pod_cidr }}
      args:
        creates: /etc/kubernetes/admin.conf

    # =====================================================
    # 2. kubeconfig 설정 (kosa)
    # =====================================================
    - name: Setup kubeconfig directory
      file:
        path: /home/kosa/.kube
        state: directory
        owner: kosa
        group: kosa
        mode: '0700'

    - name: Copy admin.conf
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/kosa/.kube/config
        remote_src: yes
        owner: kosa
        group: kosa
        mode: '0600'

    # =====================================================
    # 3. API Server Ready 대기
    # =====================================================
    - name: Wait for Kubernetes API Server
      shell: kubectl --kubeconfig=/etc/kubernetes/super-admin.conf get --raw=/readyz
      register: k8s_ready
      retries: 30
      delay: 10
      until: k8s_ready.rc == 0
      changed_when: false

    - name: Grant kube-vip lease access
      shell: |
        kubectl --kubeconfig=/etc/kubernetes/super-admin.conf apply -f - <<'EOF'
        apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: kube-vip-lease-manager
          namespace: kube-system
        rules:
          - apiGroups: ["coordination.k8s.io"]
            resources: ["leases"]
            verbs: ["get", "list", "watch", "create", "update", "patch"]
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: kube-vip-lease-manager
          namespace: kube-system
        subjects:
          - kind: User
            name: kubernetes-admin
            apiGroup: rbac.authorization.k8s.io
        roleRef:
          kind: Role
          name: kube-vip-lease-manager
          apiGroup: rbac.authorization.k8s.io
        EOF

    - name: Restart kube-vip after RBAC is ready
      shell: |
        crictl ps -a --name kube-vip -q | xargs -r crictl stop || true
        crictl ps -a --name kube-vip -q | xargs -r crictl rm || true

    - name: Remove bootstrap VIP after kube-vip takes over
      shell: |
        ip addr del {{ vip_address }}/{{ vip_cidr }} dev {{ vip_interface }} 2>/dev/null || true

    - name: Wait for Kubernetes API through VIP
      shell: kubectl --kubeconfig=/etc/kubernetes/super-admin.conf --server=https://{{ vip_address }}:6443 get --raw=/readyz
      register: vip_ready
      retries: 30
      delay: 5
      until: vip_ready.rc == 0
      changed_when: false

    # =====================================================
    # 4. Calico 설치
    # =====================================================
    - name: Configure Calico Kubernetes API endpoint
      shell: |
        kubectl -n kube-system create configmap kubernetes-services-endpoint \
          --from-literal=KUBERNETES_SERVICE_HOST={{ vip_address }} \
          --from-literal=KUBERNETES_SERVICE_PORT=6443 \
          --dry-run=client -o yaml | kubectl apply -f -
      environment:
        KUBECONFIG: "/home/kosa/.kube/config"

    - name: Render Calico manifest
      template:
        src: ../files/calico.yaml
        dest: /tmp/calico.yaml
        mode: '0644'

    - name: Install Calico
      shell: |
        kubectl apply -f /tmp/calico.yaml
      environment:
        KUBECONFIG: "/home/kosa/.kube/config"

    # =====================================================
    # 5. join command 생성
    # =====================================================
    - name: Get worker join command
      shell: kubeadm token create --print-join-command
      register: worker_join
      no_log: true

    - name: Get certificate key
      shell: kubeadm init phase upload-certs --upload-certs
      register: cert_key_raw
      no_log: true

    - name: Set join facts
      set_fact:
        worker_join_cmd: "{{ worker_join.stdout }}"
        cert_key: "{{ cert_key_raw.stdout_lines[-1] }}"
      no_log: true
