- name: Prepare local disk for etcd
  hosts: cp1,cp2,cp3
  become: true

  tasks:
    # =====================================================
    # etcd 전용 로컬 디스크 존재 여부 확인
    # - control-plane 노드에 추가한 local disk가 실제로 인식되는지 확인
    # - /dev/disk/by-id 경로를 사용해 디스크 이름 변경 문제를 줄임
    # =====================================================
    - name: Check etcd disk exists
      stat:
        path: "{{ etcd_disk }}"
      register: etcd_disk_stat

    # =====================================================
    # etcd 디스크가 없으면 즉시 실패 처리
    # - 디스크가 없는 상태에서 계속 진행하면 OS 디스크에 마운트/포맷 작업이 잘못 적용될 수 있음
    # - VM에 local disk가 제대로 추가되었는지 확인하도록 중단
    # =====================================================
    - name: Fail if etcd disk does not exist
      fail:
        msg: "etcd disk {{ etcd_disk }} does not exist. Check VM local disk attachment."
      when: not etcd_disk_stat.stat.exists

    # =====================================================
    # etcd 디스크에 ext4 파일시스템 생성
    # - etcd data directory로 사용할 디스크를 ext4로 준비
    # - force_format_etcd_disk=true일 때만 강제 포맷
    # - 기존 데이터가 있는 디스크를 실수로 포맷하지 않도록 기본값은 false
    # =====================================================
    - name: Ensure ext4 filesystem on etcd disk
      filesystem:
        fstype: ext4
        dev: "{{ etcd_disk }}"
        force: "{{ force_format_etcd_disk | default(false) | bool }}"

    # =====================================================
    # etcd 디스크 UUID 조회
    # - /etc/fstab에는 /dev/sdb 같은 장치명보다 UUID 사용이 안전함
    # - 재부팅 후 디스크 이름이 바뀌어도 동일 디스크를 마운트할 수 있음
    # =====================================================
    - name: Get etcd disk UUID
      command: blkid -s UUID -o value {{ etcd_disk }}
      register: etcd_disk_uuid
      changed_when: false

    # =====================================================
    # etcd 디스크 raw 마운트 포인트 생성 및 마운트
    # - 디스크를 /var/lib/etcd에 직접 마운트하면 ext4의 lost+found가
    #   etcd 데이터 디렉터리에 나타나 문제가 발생함
    # - /mnt/etcd에 디스크를 마운트하고 하위 data/ 서브디렉터리를
    #   /var/lib/etcd에 bind mount해서 lost+found를 격리
    # =====================================================
    - name: Create etcd disk mount directory
      file:
        path: "{{ etcd_disk_mount }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Mount local disk to {{ etcd_disk_mount }}
      mount:
        path: "{{ etcd_disk_mount }}"
        src: "UUID={{ etcd_disk_uuid.stdout }}"
        fstype: ext4
        opts: defaults,noatime
        state: mounted

    - name: Create etcd data subdirectory inside disk mount
      file:
        path: "{{ etcd_disk_mount }}/data"
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Create etcd data directory for bind mount target
      file:
        path: "{{ etcd_mount }}"
        state: directory
        owner: root
        group: root
        mode: '0700'

    # =====================================================
    # /mnt/etcd/data를 /var/lib/etcd에 bind mount
    # - etcd는 /var/lib/etcd에서 lost+found 없는 클린 디렉터리를 봄
    # =====================================================
    - name: Bind mount etcd data subdirectory to {{ etcd_mount }}
      mount:
        path: "{{ etcd_mount }}"
        src: "{{ etcd_disk_mount }}/data"
        fstype: none
        opts: bind
        state: mounted
