- name: Common Kubernetes Setup
  hosts: k8s
  become: true

  handlers:
    # =====================================================
    # containerd 재시작
    # =====================================================
    - name: Restart containerd
      service:
        name: containerd
        state: restarted
        enabled: yes

  tasks:
    # =====================================================
    # 필수 패키지 설치
    # =====================================================
    - name: Update apt cache and install dependencies
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gpg
        state: present
        update_cache: yes
      register: apt_result
      retries: 5
      delay: 10
      until: apt_result is succeeded

    # =====================================================
    # swap 비활성화
    # =====================================================
    - name: Disable swap
      command: swapoff -a
      changed_when: false

    # =====================================================
    # /etc/fstab에서 swap 항목 주석 처리
    # =====================================================
    - name: Disable swap in fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '#\1'

    # =====================================================
    # Kubernetes 네트워크용 커널 모듈 설정
    # =====================================================
    - name: Load kernel modules config
      copy:
        dest: /etc/modules-load.d/k8s.conf
        mode: '0644'
        content: |
          overlay
          br_netfilter

    # =====================================================
    # 커널 모듈 즉시 로드
    # =====================================================
    - name: Enable kernel modules
      shell: |
        modprobe overlay
        modprobe br_netfilter
      changed_when: false

    # =====================================================
    # Kubernetes 네트워크 sysctl 설정
    # =====================================================
    - name: Configure sysctl
      copy:
        dest: /etc/sysctl.d/k8s.conf
        mode: '0644'
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1

    # =====================================================
    # sysctl 설정 적용
    # =====================================================
    - name: Apply sysctl
      command: sysctl --system
      changed_when: false

    # =====================================================
    # Kubernetes node_ip가 실제 VM에 존재하는지 확인
    # =====================================================
    - name: Validate Kubernetes node network address
      shell: ip -4 addr show dev {{ node_interface }} | grep -Fq "{{ node_ip | default(ansible_host) }}/"
      changed_when: false

    # =====================================================
    # containerd 설치
    # =====================================================
    - name: Install containerd
      apt:
        name:
          - containerd
        state: present
        update_cache: yes
      register: containerd_apt_result
      retries: 5
      delay: 10
      until: containerd_apt_result is succeeded

    # =====================================================
    # containerd 설정 디렉터리 생성
    # =====================================================
    - name: Create containerd config directory
      file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    # =====================================================
    # containerd 기본 설정 생성
    # =====================================================
    - name: Generate default containerd config
      command: containerd config default
      register: containerd_default_config
      changed_when: false

    # =====================================================
    # containerd systemd cgroup 설정
    # =====================================================
    - name: Configure containerd
      copy:
        dest: /etc/containerd/config.toml
        mode: '0644'
        content: "{{ containerd_default_config.stdout | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') }}\n"
      notify: Restart containerd

    # =====================================================
    # containerd 서비스 활성화
    # =====================================================
    - name: Enable containerd
      service:
        name: containerd
        enabled: yes

    # =====================================================
    # crictl 기본 runtime endpoint 설정
    # =====================================================
    - name: Install crictl config
      copy:
        dest: /etc/crictl.yaml
        mode: '0644'
        content: |
          runtime-endpoint: unix:///run/containerd/containerd.sock
          image-endpoint: unix:///run/containerd/containerd.sock
          timeout: 10
          debug: false

    # =====================================================
    # APT keyring 디렉터리 생성
    # =====================================================
    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    # =====================================================
    # Kubernetes APT GPG key 다운로드
    # =====================================================
    - name: Download Kubernetes GPG key
      get_url:
        url: https://pkgs.k8s.io/core:/stable:/v{{ kube_minor_version }}/deb/Release.key
        dest: /tmp/kubernetes.key
        mode: '0644'

    # =====================================================
    # Kubernetes GPG key 변환
    # =====================================================
    - name: Convert Kubernetes GPG key
      command: gpg --batch --yes --dearmor -o /etc/apt/keyrings/kubernetes.gpg /tmp/kubernetes.key
      changed_when: false

    # =====================================================
    # Kubernetes APT repository 추가
    # =====================================================
    - name: Add Kubernetes repo
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        mode: '0644'
        content: |
          deb [signed-by=/etc/apt/keyrings/kubernetes.gpg] https://pkgs.k8s.io/core:/stable:/v{{ kube_minor_version }}/deb/ /

    # =====================================================
    # Kubernetes repository 반영을 위한 apt update
    # =====================================================
    - name: Update apt cache
      apt:
        update_cache: yes
      register: kubernetes_repo_apt_result
      retries: 5
      delay: 10
      until: kubernetes_repo_apt_result is succeeded

    # =====================================================
    # kubelet, kubeadm, kubectl 설치
    # =====================================================
    - name: Install Kubernetes packages
      apt:
        name:
          - "kubelet={{ kubernetes_apt_version }}"
          - "kubeadm={{ kubernetes_apt_version }}"
          - "kubectl={{ kubernetes_apt_version }}"
        state: present
      register: kubernetes_packages_apt_result
      retries: 5
      delay: 10
      until: kubernetes_packages_apt_result is succeeded

    # =====================================================
    # kubelet 서비스 활성화
    # =====================================================
    - name: Enable kubelet service
      service:
        name: kubelet
        enabled: yes

    # =====================================================
    # kubelet node-ip 설정
    # - Kubernetes 내부 통신에 사용할 10.10.10.x IP를 명시
    # =====================================================
    - name: Configure kubelet node IP
      copy:
        dest: /etc/default/kubelet
        mode: '0644'
        content: |
          KUBELET_EXTRA_ARGS=--node-ip={{ node_ip | default(ansible_host) }}
      register: kubelet_default

    # =====================================================
    # kubelet node-ip 설정 변경 시 kubelet 재시작
    # - kubeadm init/join 전에는 kubelet이 완전히 정상 상태가 아닐 수 있으므로 실패 허용
    # =====================================================
    - name: Restart kubelet when node IP config changes
      service:
        name: kubelet
        state: restarted
        enabled: yes
      when: kubelet_default.changed
      failed_when: false

    # =====================================================
    # Kubernetes 패키지 버전 고정
    # =====================================================
    - name: Hold Kubernetes packages
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

# =========================================================
# kubectl / kubeadm bash 자동완성 설정 (control-plane only)
# =========================================================
- name: Configure kubectl bash completion on control-plane nodes
  hosts: control_plane
  become: true

  tasks:
    - name: Install bash-completion
      apt:
        name: bash-completion
        state: present

    - name: Add kubectl completion to kosa .bashrc
      lineinfile:
        path: /home/kosa/.bashrc
        line: "source <(kubectl completion bash)"
        create: true

    - name: Add kubeadm completion to kosa .bashrc
      lineinfile:
        path: /home/kosa/.bashrc
        line: "source <(kubeadm completion bash)"
        create: true
