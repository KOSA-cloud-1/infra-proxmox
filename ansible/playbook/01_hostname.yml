- name: Initialize node hostnames and hosts file
  hosts: k8s
  become: true
  gather_facts: true

  tasks:
    - name: Set hostname
      hostname:
        name: "{{ inventory_hostname }}"

    # cloud-init이 /etc/hosts를 다시 덮어쓰지 않도록 설정
    - name: Disable cloud-init hosts management
      lineinfile:
        path: /etc/cloud/cloud.cfg
        regexp: '^manage_etc_hosts:'
        line: 'manage_etc_hosts: false'
        create: true

    - name: Configure /etc/hosts for Kubernetes nodes
      copy:
        dest: /etc/hosts
        owner: root
        group: root
        mode: '0644'
        content: |
          127.0.0.1 localhost
          127.0.1.1 {{ inventory_hostname }}

          {% for host in groups['k8s'] %}
          {{ hostvars[host]['node_ip'] }} {{ host }}
          {% endfor %}

          {{ vip_address }} {{ vip_hostname }}

          ::1 localhost ip6-localhost ip6-loopback
          ff02::1 ip6-allnodes
          ff02::2 ip6-allrouters

    - name: Check hostname
      command: hostname
      register: hostname_result
      changed_when: false

    - name: Check hosts resolution
      command: getent hosts {{ item }}
      loop: "{{ groups['k8s'] + [vip_hostname] }}"
      register: hosts_resolution_result
      changed_when: false

    - name: Print hostname
      debug:
        msg: "{{ hostname_result.stdout }}"

    - name: Print hosts resolution
      debug:
        var: hosts_resolution_result.results
