- name: Common Kubernetes Setup
  hosts: k8s
  become: true

  handlers:
    - name: Restart containerd
      service:
        name: containerd
        state: restarted
        enabled: yes

  tasks:

    - name: Update apt cache and install dependencies
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gpg
        state: present
        update_cache: yes
        lock_timeout: 300
      register: apt_result
      retries: 5
      delay: 10
      until: apt_result is succeeded

    - name: Disable swap
      command: swapoff -a
      changed_when: false

    - name: Disable swap in fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '#\1'

    - name: Load kernel modules
      copy:
        dest: /etc/modules-load.d/k8s.conf
        mode: '0644'
        content: |
          overlay
          br_netfilter

    - name: Enable kernel modules
      shell: |
        modprobe overlay
        modprobe br_netfilter
      changed_when: false

    - name: Configure sysctl
      copy:
        dest: /etc/sysctl.d/k8s.conf
        mode: '0644'
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1

    - name: Apply sysctl
      command: sysctl --system
      changed_when: false

    - name: Validate Kubernetes node network address
      shell: ip -4 addr show dev {{ node_interface }} | grep -Fq "{{ node_ip | default(ansible_host) }}/"
      changed_when: false

    - name: Install containerd
      apt:
        name:
          - containerd
        state: present
        update_cache: yes
        lock_timeout: 300

    - name: Create containerd config directory
      file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: Generate default containerd config
      command: containerd config default
      register: containerd_default_config
      changed_when: false

    - name: Configure containerd
      copy:
        dest: /etc/containerd/config.toml
        mode: '0644'
        content: "{{ containerd_default_config.stdout | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') }}\n"
      notify: Restart containerd

    - name: Enable containerd
      service:
        name: containerd
        enabled: yes

    - name: Install crictl config
      copy:
        dest: /etc/crictl.yaml
        mode: '0644'
        content: |
          runtime-endpoint: unix:///run/containerd/containerd.sock
          image-endpoint: unix:///run/containerd/containerd.sock
          timeout: 10
          debug: false

    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Kubernetes GPG key
      get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key
        dest: /tmp/kubernetes.key
        mode: '0644'

    - name: Convert key
      command: gpg --batch --yes --dearmor -o /etc/apt/keyrings/kubernetes.gpg /tmp/kubernetes.key

    - name: Add Kubernetes repo
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: |
          deb [signed-by=/etc/apt/keyrings/kubernetes.gpg] https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /

    - name: Update apt cache
      apt:
        update_cache: yes
        lock_timeout: 300

    - name: Set kube version
      set_fact:
        kube_version: "1.30.1-1.1"

    - name: Install Kubernetes packages
      apt:
        name:
          - "kubelet={{ kube_version }}"
          - "kubeadm={{ kube_version }}"
          - "kubectl={{ kube_version }}"
        state: present
        lock_timeout: 300

    - name: Enable kubelet service
      service:
        name: kubelet
        enabled: yes

    - name: Configure kubelet node IP
      copy:
        dest: /etc/default/kubelet
        mode: '0644'
        content: |
          KUBELET_EXTRA_ARGS=--node-ip={{ node_ip | default(ansible_host) }}
      register: kubelet_default

    - name: Restart kubelet when node IP config changes
      service:
        name: kubelet
        state: restarted
        enabled: yes
      when: kubelet_default.changed

    - name: Hold Kubernetes packages
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl
