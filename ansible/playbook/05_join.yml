# =========================================================
# Prepare fresh kubeadm join data
# =========================================================
- name: Prepare kubeadm join data
  hosts: cp1
  become: true
  become_user: root

  tasks:

    - name: Wait for Kubernetes API on cp1
      command: >
        kubectl --kubeconfig=/etc/kubernetes/admin.conf
        --server=https://{{ node_ip | default(ansible_host) }}:6443
        --request-timeout=10s
        get --raw=/readyz
      register: cp1_readyz
      changed_when: false
      retries: 30
      delay: 5
      until: cp1_readyz.rc == 0

    - name: Create fresh worker join command
      command: kubeadm token create --print-join-command
      register: worker_join
      no_log: "{{ hide_join_secrets | default(true) | bool }}"

    - name: Upload control-plane certificates and get certificate key
      command: kubeadm init phase upload-certs --upload-certs
      register: cert_key_raw
      no_log: "{{ hide_join_secrets | default(true) | bool }}"

    - name: Set join facts
      set_fact:
        worker_join_cmd: "{{ worker_join.stdout | trim }}"
        cert_key: "{{ cert_key_raw.stdout_lines[-1] | trim }}"
      no_log: "{{ hide_join_secrets | default(true) | bool }}"

    - name: Ensure local files directory exists
      file:
        path: "../files"
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false

    - name: Save worker join command to local file
      copy:
        dest: "../files/worker_join_cmd.txt"
        content: "{{ worker_join.stdout | trim }}\n"
        mode: '0600'
      delegate_to: localhost
      become: false
      no_log: "{{ hide_join_secrets | default(true) | bool }}"

    - name: Save certificate key to local file
      copy:
        dest: "../files/cert_key.txt"
        content: "{{ cert_key_raw.stdout_lines[-1] | trim }}\n"
        mode: '0600'
      delegate_to: localhost
      become: false
      no_log: "{{ hide_join_secrets | default(true) | bool }}"

# =========================================================
# CP2, CP3 - Control Plane Join
# =========================================================
- name: Join additional control planes
  hosts: cp2,cp3
  become: true
  serial: 1

  tasks:

    - name: Check control-plane admin config
      stat:
        path: /etc/kubernetes/admin.conf
      register: control_plane_admin_conf

    - name: Check local etcd manifest
      stat:
        path: /etc/kubernetes/manifests/etcd.yaml
      register: control_plane_etcd_manifest

    - name: Check this node is a full voting etcd member
      shell: |
        eid=$(crictl ps --name etcd -q | head -n1)
        if [ -z "$eid" ]; then exit 1; fi
        crictl exec "$eid" etcdctl \
          --endpoints=https://127.0.0.1:2379 \
          --cacert=/etc/kubernetes/pki/etcd/ca.crt \
          --cert=/etc/kubernetes/pki/etcd/server.crt \
          --key=/etc/kubernetes/pki/etcd/server.key \
          member list | grep "{{ node_ip | default(ansible_host) }}" | grep -v ", true$"
      delegate_to: cp1
      register: etcd_voting_check
      failed_when: false
      changed_when: false

    - name: Set control-plane completion fact
      set_fact:
        control_plane_complete: >-
          {{
            control_plane_admin_conf.stat.exists and
            control_plane_etcd_manifest.stat.exists and
            etcd_voting_check.rc == 0
          }}

    - name: Remove stale etcd member before joining
      shell: |
        eid=$(crictl ps --name etcd -q | head -n1)
        mid=$(crictl exec "$eid" etcdctl \
          --endpoints=https://127.0.0.1:2379 \
          --cacert=/etc/kubernetes/pki/etcd/ca.crt \
          --cert=/etc/kubernetes/pki/etcd/server.crt \
          --key=/etc/kubernetes/pki/etcd/server.key \
          member list | awk -F", " '/{{ node_ip | default(ansible_host) }}/ {print $1; exit}')
        if [ -n "$mid" ]; then
          crictl exec "$eid" etcdctl \
            --endpoints=https://127.0.0.1:2379 \
            --cacert=/etc/kubernetes/pki/etcd/ca.crt \
            --cert=/etc/kubernetes/pki/etcd/server.crt \
            --key=/etc/kubernetes/pki/etcd/server.key \
            member remove "$mid"
        fi
      delegate_to: cp1
      when: not control_plane_complete

    - name: Reset control-plane join state
      shell: |
        systemctl stop kubelet || true
        kubeadm reset -f || true
        for name in kube-apiserver kube-controller-manager kube-scheduler etcd; do
          pkill -x "$name" 2>/dev/null || true
        done
        ps -eo pid=,comm=,args= | awk '$2 == "containerd-shim-runc-v2" && $0 ~ /-namespace k8s.io/ {print $1}' | xargs -r kill 2>/dev/null || true
        rm -rf /etc/kubernetes /var/lib/kubelet /etc/cni/net.d /opt/cni /var/lib/cni /root/.kube /home/kosa/.kube
        mkdir -p /var/lib/etcd
        find /var/lib/etcd -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        ip link delete tunl0 2>/dev/null || true
        ip route flush proto bird 2>/dev/null || true
        systemctl restart containerd
      when: not control_plane_complete

    - name: Wait for cp1 etcd to be healthy before joining
      shell: |
        eid=$(crictl ps --name etcd -q | head -n1)
        crictl exec "$eid" etcdctl \
          --endpoints=https://127.0.0.1:2379 \
          --cacert=/etc/kubernetes/pki/etcd/ca.crt \
          --cert=/etc/kubernetes/pki/etcd/server.crt \
          --key=/etc/kubernetes/pki/etcd/server.key \
          endpoint health
      delegate_to: cp1
      register: etcd_health
      retries: 12
      delay: 5
      until: etcd_health.rc == 0
      changed_when: false
      when: not control_plane_complete

    - name: Pull control-plane images
      command: kubeadm config images pull --kubernetes-version v{{ kube_version }}
      changed_when: false
      when: not control_plane_complete

    - name: Wait for VIP to be reachable before joining
      shell: curl -sk --connect-timeout 3 https://{{ vip_address }}:6443/readyz
      register: vip_reachable
      retries: 40
      delay: 5
      until: vip_reachable.rc == 0
      changed_when: false
      when: not control_plane_complete

    - name: Join control plane
      shell: >
        {{ hostvars['cp1']['worker_join_cmd'] }}
        --control-plane
        --apiserver-advertise-address {{ node_ip | default(ansible_host) }}
        --certificate-key {{ hostvars['cp1']['cert_key'] }}
      args:
        creates: /etc/kubernetes/manifests/etcd.yaml
      register: control_plane_join_result
      no_log: "{{ hide_join_secrets | default(true) | bool }}"

    - name: Auto-promote etcd learner to voting member
      shell: |
        eid=$(crictl ps --name etcd -q | head -n1)
        mid=$(crictl exec "$eid" etcdctl \
          --endpoints=https://127.0.0.1:2379 \
          --cacert=/etc/kubernetes/pki/etcd/ca.crt \
          --cert=/etc/kubernetes/pki/etcd/server.crt \
          --key=/etc/kubernetes/pki/etcd/server.key \
          member list | awk -F", " '/{{ node_ip | default(ansible_host) }}/ && $NF == "true" {print $1}')
        if [ -n "$mid" ]; then
          crictl exec "$eid" etcdctl \
            --endpoints=https://127.0.0.1:2379 \
            --cacert=/etc/kubernetes/pki/etcd/ca.crt \
            --cert=/etc/kubernetes/pki/etcd/server.crt \
            --key=/etc/kubernetes/pki/etcd/server.key \
            member promote "$mid"
        fi
      delegate_to: cp1
      register: etcd_promote
      retries: 24
      delay: 5
      until: etcd_promote.rc == 0
      changed_when: "'promoted' in etcd_promote.stdout"

    - name: Wait for this node's etcd to be healthy after join
      shell: |
        eid=$(crictl ps --name etcd -q | head -n1)
        [ -z "$eid" ] && exit 1
        crictl exec "$eid" etcdctl \
          --endpoints=https://127.0.0.1:2379 \
          --cacert=/etc/kubernetes/pki/etcd/ca.crt \
          --cert=/etc/kubernetes/pki/etcd/server.crt \
          --key=/etc/kubernetes/pki/etcd/server.key \
          endpoint health
      register: post_join_etcd_health
      retries: 60
      delay: 5
      until: post_join_etcd_health.rc == 0
      changed_when: false

    - name: Setup kubeconfig directory
      file:
        path: /home/kosa/.kube
        state: directory
        owner: kosa
        group: kosa
        mode: '0700'

    - name: Copy kubeconfig
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/kosa/.kube/config
        remote_src: yes
        owner: kosa
        group: kosa
        mode: '0600'

    - name: Remove wrong KUBECONFIG from kosa bashrc on control-plane nodes
      lineinfile:
        path: /home/kosa/.bashrc
        regexp: '^export KUBECONFIG=/etc/kubernetes/admin\.conf$'
        state: absent
      failed_when: false



# =========================================================
# Worker Nodes Join
# =========================================================
- name: Join worker nodes
  hosts: workers
  become: true
  become_user: root

  tasks:

    - name: Check worker kubelet config
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: worker_kubelet_conf

    - name: Join worker
      shell: >
        {{ hostvars['cp1']['worker_join_cmd'] }}
        --node-name {{ inventory_hostname }}
      args:
        creates: /etc/kubernetes/kubelet.conf
      register: worker_join_result
      no_log: "{{ hide_join_secrets | default(true) | bool }}"

    - name: Check worker kubelet config after join
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: worker_kubelet_conf_after

    - name: Fail when worker join did not create kubelet config
      fail:
        msg: Worker join failed and /etc/kubernetes/kubelet.conf was not created.
      when: not worker_kubelet_conf_after.stat.exists

    - name: Wait for worker node registration
      command: >
        kubectl --kubeconfig=/etc/kubernetes/admin.conf
        --server=https://{{ hostvars['cp1'].node_ip | default(hostvars['cp1'].ansible_host) }}:6443
        --request-timeout=10s
        get node {{ inventory_hostname }}
      delegate_to: cp1
      register: worker_node_check
      changed_when: false
      retries: 30
      delay: 5
      until: worker_node_check.rc == 0


# =========================================================
# Worker read-only kubeconfig
# =========================================================
- name: Create worker read-only kubeconfig
  hosts: cp1
  become: true
  become_user: root

  tasks:

    - name: Apply worker read-only RBAC
      shell: |
        kubectl --kubeconfig=/etc/kubernetes/admin.conf --server=https://{{ node_ip | default(ansible_host) }}:6443 --request-timeout=10s apply -f - <<'EOF'
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: worker-readonly
          namespace: kube-system
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: worker-readonly
        rules:
          - apiGroups: [""]
            resources: ["configmaps", "endpoints", "events", "namespaces", "nodes", "pods", "pods/log", "services"]
            verbs: ["get", "list", "watch"]
          - apiGroups: ["apps"]
            resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
            verbs: ["get", "list", "watch"]
          - apiGroups: ["batch"]
            resources: ["cronjobs", "jobs"]
            verbs: ["get", "list", "watch"]
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: worker-readonly
        subjects:
          - kind: ServiceAccount
            name: worker-readonly
            namespace: kube-system
        roleRef:
          kind: ClusterRole
          name: worker-readonly
          apiGroup: rbac.authorization.k8s.io
        ---
        apiVersion: v1
        kind: Secret
        metadata:
          name: worker-readonly-token
          namespace: kube-system
          annotations:
            kubernetes.io/service-account.name: worker-readonly
        type: kubernetes.io/service-account-token
        EOF

    - name: Wait for worker read-only token
      command: >
        kubectl --kubeconfig=/etc/kubernetes/admin.conf
        --server=https://{{ node_ip | default(ansible_host) }}:6443
        --request-timeout=10s
        -n kube-system get secret worker-readonly-token -o jsonpath={.data.token}
      register: worker_readonly_token
      changed_when: false
      retries: 30
      delay: 2
      until: worker_readonly_token.stdout | length > 0
      no_log: true

    - name: Read cluster CA
      slurp:
        src: /etc/kubernetes/pki/ca.crt
      register: worker_readonly_ca
      no_log: true

    - name: Build worker read-only kubeconfig
      set_fact:
        worker_readonly_kubeconfig: |
          apiVersion: v1
          kind: Config
          clusters:
            - name: kubernetes
              cluster:
                certificate-authority-data: {{ worker_readonly_ca.content }}
                server: https://{{ vip_address }}:6443
          users:
            - name: worker-readonly
              user:
                token: {{ worker_readonly_token.stdout | b64decode }}
          contexts:
            - name: worker-readonly@kubernetes
              context:
                cluster: kubernetes
                user: worker-readonly
          current-context: worker-readonly@kubernetes
      no_log: true


- name: Install worker read-only kubeconfig
  hosts: workers
  become: true
  become_user: root

  tasks:

    - name: Setup worker kubeconfig directory
      file:
        path: /home/kosa/.kube
        state: directory
        owner: kosa
        group: kosa
        mode: '0700'

    - name: Install worker read-only kubeconfig
      copy:
        content: "{{ hostvars['cp1']['worker_readonly_kubeconfig'] }}"
        dest: /home/kosa/.kube/config
        owner: kosa
        group: kosa
        mode: '0600'
      no_log: true

    - name: Remove wrong KUBECONFIG from kosa bashrc on worker nodes
      lineinfile:
        path: /home/kosa/.bashrc
        regexp: '^export KUBECONFIG=/etc/kubernetes/admin\.conf$'
        state: absent
      failed_when: false


    - name: Verify worker read-only kubeconfig
      become_user: kosa
      command: kubectl --kubeconfig=/home/kosa/.kube/config get node {{ inventory_hostname }}
      register: worker_readonly_check
      changed_when: false
      retries: 30
      delay: 5
      until: worker_readonly_check.rc == 0

    - name: Remove local join secret files after cluster join
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "../files/worker_join_cmd.txt"
        - "../files/cert_key.txt"
      delegate_to: localhost
      become: false
      no_log: true
