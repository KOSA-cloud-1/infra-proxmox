- name: Install kube-vip manifest
  hosts: kube_vip
  become: true

  tasks:
    # =====================================================
    # kube-vip static pod manifest 생성
    # - control-plane endpoint VIP를 제공하기 위한 static pod
    # - kubeadm init 전에 /etc/kubernetes/manifests 에 배치
    # =====================================================
    - name: Create manifests dir
      file:
        path: /etc/kubernetes/manifests
        state: directory
        mode: '0755'

    - name: Pull kube-vip image
      command: crictl pull ghcr.io/kube-vip/kube-vip:{{ kube_vip_version }}
      changed_when: false

    # cp2, cp3는 init 전에 manifests에 배치 (join 전 kube-vip 참여 필요)
    # cp1은 kubeadm init 중 kube-vip가 static pod로 떠서 leader election을
    # 시도하면 bootstrap VIP를 건드려 API server 기동에 실패하므로
    # init 완료 후 RBAC 적용 단계에서 manifest를 배치함
    - name: Generate kube-vip manifest
      shell: |
        ctr -n k8s.io run --rm --net-host ghcr.io/kube-vip/kube-vip:{{ kube_vip_version }} vip /kube-vip manifest pod \
          --interface {{ vip_interface }} \
          --address {{ vip_address }} \
          --vipSubnet /{{ vip_cidr | default(32) }} \
          --controlplane \
          --arp \
          --leaderElection \
          --leaseDuration 15 \
          --leaseRenewDuration 10 \
          --leaseRetry 2 \
        > /etc/kubernetes/manifests/kube-vip.yaml
      args:
        executable: /bin/bash
        creates: /etc/kubernetes/manifests/kube-vip.yaml
      when: inventory_hostname != 'cp1'

    - name: Pre-generate kube-vip manifest for cp1 to temp location
      shell: |
        ctr -n k8s.io run --rm --net-host ghcr.io/kube-vip/kube-vip:{{ kube_vip_version }} vip /kube-vip manifest pod \
          --interface {{ vip_interface }} \
          --address {{ vip_address }} \
          --vipSubnet /{{ vip_cidr | default(32) }} \
          --controlplane \
          --arp \
          --leaderElection \
          --leaseDuration 15 \
          --leaseRenewDuration 10 \
          --leaseRetry 2 \
        > /tmp/kube-vip-manifest.yaml
      args:
        executable: /bin/bash
      when: inventory_hostname == 'cp1'


- name: Initialize Kubernetes Cluster
  hosts: cp1
  become: true
  become_user: root

  tasks:
    # =====================================================
    # kubeadm init 이전 control-plane 포트 점유 확인
    # - 기존 Kubernetes 프로세스가 남아 있으면 kubeadm init이 실패함
    # - 아래 포트가 하나라도 사용 중이면 즉시 실패 처리
    #   6443  : kube-apiserver
    #   2379  : etcd client
    #   2380  : etcd peer
    #   10257 : kube-controller-manager
    #   10259 : kube-scheduler
    # =====================================================
    - name: Check remaining Kubernetes control-plane ports
      shell: ss -lntp | grep -E '6443|2379|2380|10257|10259' || true
      register: remaining_k8s_ports
      changed_when: false

    - name: Fail if Kubernetes control-plane ports are still in use
      fail:
        msg: |
          Kubernetes control-plane ports are still in use.
          Run kubeadm reset and clean remaining processes before kubeadm init.

          Remaining ports:
          {{ remaining_k8s_ports.stdout }}
      when: remaining_k8s_ports.stdout | length > 0

    # =====================================================
    # /var/lib/etcd 마운트 여부 확인
    # - etcd를 local disk에 저장하는 구조에서는 필수 검증
    # - /var/lib/etcd가 마운트되어 있지 않으면 즉시 실패 처리
    # - 마운트가 안 된 상태로 init하면 etcd가 OS/Ceph 디스크에 저장될 수 있음
    # =====================================================
    - name: Check etcd mount
      command: findmnt /var/lib/etcd
      register: etcd_mount_check
      changed_when: false
      failed_when: false

    - name: Fail if /var/lib/etcd is not mounted
      fail:
        msg: |
          /var/lib/etcd is not mounted.
          etcd must use local disk before kubeadm init.

          Expected:
            /var/lib/etcd mounted from local disk

          Check:
            df -h /var/lib/etcd
            findmnt /var/lib/etcd
      when: etcd_mount_check.rc != 0

    # =====================================================
    # /var/lib/etcd 기존 데이터 확인
    # - 재설치 전에 기존 etcd 데이터가 남아 있으면 init 충돌 가능
    # - /var/lib/etcd는 /mnt/etcd/data의 bind mount이므로
    #   lost+found가 없음 → 단순하게 전체 내용 확인
    # =====================================================
    - name: Check existing etcd data
      shell: |
        find /var/lib/etcd -mindepth 1 -maxdepth 1
      register: existing_etcd_data
      changed_when: false

    - name: Fail if existing etcd data remains
      fail:
        msg: |
          Existing etcd data remains in /var/lib/etcd.
          Clean it before kubeadm init.

          Existing data:
          {{ existing_etcd_data.stdout }}

          Cleanup command:
            sudo rm -rf /var/lib/etcd/*
      when: existing_etcd_data.stdout | length > 0

    # =====================================================
    # /var/lib/etcd 마운트 결과 출력
    # - 실패 조건 통과 후 실제 어떤 디스크가 마운트되었는지 확인용
    # =====================================================
    - name: Print etcd mount result
      debug:
        var: etcd_mount_check.stdout_lines

    # =====================================================
    # kubeadm init 전 bootstrap VIP 할당
    # - kubeadm init 중 kubelet이 control-plane-endpoint로 접근함
    # - kube-vip가 아직 완전히 leader election을 수행하기 전이므로
    #   cp1에 VIP를 임시로 붙여 API endpoint 접근을 보장
    # =====================================================
    - name: Add bootstrap VIP for kubeadm init
      shell: |
        ip addr show dev {{ vip_interface }} | grep -Fq "{{ vip_address }}/{{ vip_cidr | default(32) }}" || \
          ip addr add {{ vip_address }}/{{ vip_cidr | default(32) }} dev {{ vip_interface }}
      args:
        executable: /bin/bash

    # =====================================================
    # API Server 인증서 SAN 목록 생성
    # - VIP IP, VIP hostname, 모든 control-plane node_ip를 인증서 SAN에 포함
    # - node_ip가 없으면 ansible_host 사용
    # =====================================================
    - name: Initialize API server certificate SANs
      set_fact:
        apiserver_cert_extra_sans: >-
          {{
            [vip_address] +
            ([vip_hostname] if (vip_hostname is defined and vip_hostname | length > 0) else [])
          }}

    - name: Add control-plane node IPs to API server certificate SANs
      set_fact:
        apiserver_cert_extra_sans: >-
          {{
            apiserver_cert_extra_sans +
            [hostvars[item].node_ip | default(hostvars[item].ansible_host)]
          }}
      loop: "{{ groups['control_plane'] }}"

    - name: Deduplicate API server certificate SANs
      set_fact:
        apiserver_cert_extra_sans: "{{ apiserver_cert_extra_sans | unique | list }}"

    # =====================================================
    # Kubernetes 클러스터 초기화
    # - control-plane-endpoint는 VIP 사용
    # - advertise-address는 node_ip 사용
    # - pod_cidr는 group_vars/all.yml의 pod_cidr 사용
    # =====================================================
    - name: Initialize cluster
      shell: |
        kubeadm init \
          --kubernetes-version=v{{ kube_version | regex_replace('-.*$', '') }} \
          --control-plane-endpoint "{{ vip_address }}:6443" \
          --apiserver-advertise-address "{{ node_ip | default(ansible_host) }}" \
          --apiserver-cert-extra-sans "{{ apiserver_cert_extra_sans | join(',') }}" \
          --upload-certs \
          --pod-network-cidr={{ pod_cidr }}
      args:
        executable: /bin/bash
        creates: /etc/kubernetes/admin.conf
      register: kubeadm_init_result
      no_log: "{{ hide_join_secrets | default(true) | bool }}"

    # =====================================================
    # kubeconfig 설정
    # - 일반 사용자 kosa가 kubectl을 사용할 수 있도록 admin.conf 복사
    # =====================================================
    - name: Setup kubeconfig directory
      file:
        path: /home/kosa/.kube
        state: directory
        owner: kosa
        group: kosa
        mode: '0700'

    - name: Copy admin.conf
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/kosa/.kube/config
        remote_src: yes
        owner: kosa
        group: kosa
        mode: '0600'

    # =====================================================
    # API Server Ready 대기
    # - kube-vip 전환 전, cp1의 실제 node_ip 기준으로 API Server 상태 확인
    # =====================================================
    - name: Wait for Kubernetes API Server
      shell: kubectl --kubeconfig=/etc/kubernetes/super-admin.conf --server=https://{{ node_ip | default(ansible_host) }}:6443 --request-timeout=10s get --raw=/readyz
      register: k8s_ready
      retries: 30
      delay: 10
      until: k8s_ready.rc == 0
      changed_when: false

    # =====================================================
    # kubernetes-admin 에 cluster-admin 부여
    # - kube-vip RBAC 적용 전에 충분한 권한 확보
    # =====================================================
    - name: Grant cluster-admin to kubernetes-admin
      shell: |
        kubectl --kubeconfig=/etc/kubernetes/super-admin.conf \
          --server=https://{{ node_ip | default(ansible_host) }}:6443 \
          create clusterrolebinding kubernetes-admin-cluster-admin \
          --clusterrole=cluster-admin \
          --user=kubernetes-admin \
          --dry-run=client -o yaml | \
        kubectl --kubeconfig=/etc/kubernetes/super-admin.conf \
          --server=https://{{ node_ip | default(ansible_host) }}:6443 \
          apply -f -
      args:
        executable: /bin/bash

    # =====================================================
    # kube-vip leader election 권한 부여
    # - leases 리소스 접근 권한 필요
    # - kube-system Role이 아니라 ClusterRole/ClusterRoleBinding 사용
    # =====================================================
    - name: Grant kube-vip lease access
      shell: |
        kubectl --kubeconfig=/etc/kubernetes/super-admin.conf --server=https://{{ node_ip | default(ansible_host) }}:6443 --request-timeout=10s apply -f - <<'EOF'
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: kube-vip-lease-manager
        rules:
          - apiGroups: ["coordination.k8s.io"]
            resources: ["leases"]
            verbs: ["get", "list", "watch", "create", "update", "patch"]
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: kube-vip-lease-manager
        subjects:
          - kind: User
            name: kubernetes-admin
            apiGroup: rbac.authorization.k8s.io
        roleRef:
          kind: ClusterRole
          name: kube-vip-lease-manager
          apiGroup: rbac.authorization.k8s.io
        EOF
      args:
        executable: /bin/bash

    # =====================================================
    # kube-vip manifest 배치 및 기동 대기
    # - RBAC 적용 후 manifest를 배치해야 leader election이 정상 동작
    # - init 전에 배치하면 kube-vip가 API server 없이 leader election을
    #   시도하다가 bootstrap VIP를 건드려 API server 기동 실패
    # =====================================================
    - name: Install kube-vip manifest after RBAC is ready
      copy:
        src: /tmp/kube-vip-manifest.yaml
        dest: /etc/kubernetes/manifests/kube-vip.yaml
        remote_src: yes

    - name: Wait for kube-vip to start
      shell: crictl ps --name kube-vip -q
      register: kube_vip_running
      retries: 30
      delay: 5
      until: kube_vip_running.stdout | length > 0
      changed_when: false

    # =====================================================
    # bootstrap VIP 제거 후 kube-vip가 VIP를 인계했는지 확인
    # =====================================================
    - name: Remove bootstrap VIP after kube-vip takes over
      shell: |
        ip addr del {{ vip_address }}/{{ vip_cidr | default(32) }} dev {{ vip_interface }} 2>/dev/null || true
      args:
        executable: /bin/bash

    - name: Wait for Kubernetes API through VIP
      shell: kubectl --kubeconfig=/etc/kubernetes/super-admin.conf --server=https://{{ vip_address }}:6443 --request-timeout=10s get --raw=/readyz
      register: vip_ready
      retries: 30
      delay: 5
      until: vip_ready.rc == 0
      changed_when: false

    # =====================================================
    # join command 생성
    # - worker join command와 control-plane join에 필요한 certificate key 저장
    # - 이후 join playbook에서 ../files 값을 참조
    # =====================================================
    - name: Get worker join command
      command: kubeadm token create --print-join-command
      register: worker_join
      no_log: "{{ hide_join_secrets | default(true) | bool }}"

    - name: Get certificate key
      command: kubeadm init phase upload-certs --upload-certs
      register: cert_key_raw
      no_log: "{{ hide_join_secrets | default(true) | bool }}"

    - name: Set join facts
      set_fact:
        worker_join_cmd: "{{ worker_join.stdout }}"
        cert_key: "{{ cert_key_raw.stdout_lines[-1] }}"
      no_log: "{{ hide_join_secrets | default(true) | bool }}"

    - name: Ensure local files directory exists
      file:
        path: "../files"
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false

    - name: Save worker join command to local file
      copy:
        dest: "../files/worker_join_cmd.txt"
        content: "{{ worker_join.stdout | trim }}\n"
        mode: '0600'
      delegate_to: localhost
      become: false
      no_log: "{{ hide_join_secrets | default(true) | bool }}"

    - name: Save certificate key to local file
      copy:
        dest: "../files/cert_key.txt"
        content: "{{ cert_key_raw.stdout_lines[-1] | trim }}\n"
        mode: '0600'
      delegate_to: localhost
      become: false
      no_log: "{{ hide_join_secrets | default(true) | bool }}"
